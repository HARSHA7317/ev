<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ChargeShare</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#0b1b33;--mu:#5b6b80;--nv:#0b1b33;--em:#10b981;--bd:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#13233b;--tx:#e8eef6;--mu:#94a3b8;--bd:#25374f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
header{background:#0b1b33;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:20px;cursor:pointer}.logo b{color:var(--em)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}nav button{background:none;border:0;color:#cbd5e1;padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit}nav button.on,nav button:hover{background:#1e3352;color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.g{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{font-size:26px;font-weight:800;color:var(--em)}.mu{color:var(--mu);font-size:13px}
button.b,a.b{background:var(--em);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.b.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}button.b.r{background:#dc2626}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#e2e8f0;color:#0b1b33}.tag.ok{background:#d1fae5;color:#065f46}.tag.w{background:#fef3c7;color:#92400e}.tag.x{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--bd)}.sc{overflow-x:auto}
.hero{background:linear-gradient(135deg,#0b1b33,#0f3d3a);color:#fff;border-radius:18px;padding:40px 24px;text-align:center}.hero h1{font-size:34px;margin:0 0 8px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0b1b33;color:#fff;padding:10px 18px;border-radius:10px;z-index:20}
.pt{cursor:pointer}.pt:hover{border-color:var(--em)}
.warn{background:#fef3c7;color:#78350f;border-radius:10px;padding:10px;font-size:13px}
svg text{font-family:inherit}
</style></head><body>
<header><span class="logo" onclick="go(U?home():'land')">⚡Charge<b>Share</b></span><nav id="nav"></nav></header>
<main id="m"></main><div id="t"></div>
<script>

const dt=o=>new Date(Date.now()+o*864e5).toISOString().slice(0,10),TODAY=dt(0);

let S,U=null,V='land',P=null,BK=null,F={r:50,max:40,t:'',c:'',now:0,ver:0,rat:0,view:'map',loc:'Rajahmundry'},fl=null;

async function seed(){
 const pw=await sha('Demo@123');const u=[];

 on.forEach((n,i)=>u.push({id:'o'+(i+1),role:'owner',name:n,email:`owner${i+1}@demo.cs`,mob:'900000010'+i,pw,city:tw[i],state:'Andhra Pradesh',dist:'East Godavari',pin:'5330'+i+'1',veh:[{m:i%2?'Tata Punch EV':'Tata Nexon EV',reg:'AP05 XX 10'+i,yr:2024,pct:30+i*10,cs:i%2?'CCS2':'CCS2'}],fav:[]}));
 hn.forEach((n,i)=>u.push({id:'h'+(i+1),role:'host',name:n,email:`host${i+1}@demo.cs`,mob:'900000020'+i,pw,city:tw[i],state:'Andhra Pradesh',dist:'East Godavari',pin:'5330'+i+'2',addr:`Plot ${i+12}, Demo Colony, ${tw[i]}`,v:{mobile:1,email:i<4?1:0,property:i<3?1:0,charger:i<3?1:0,safety:i<2?1:0},susp:0}));
 u.push({id:'a1',role:'admin',name:'Admin Demo',email:'admin@demo.cs',mob:'9000000300',pw,city:'Rajahmundry',state:'Andhra Pradesh'});
 const pn=[['Green Porch Charger','h1','Rajahmundry',17.0035,81.8095,12,7.4,'AC','Type 2'],['Godavari EV Hub','h2','Kakinada',16.9925,82.2441,14,7.4,'AC','Type 2'],['Surampalem Quick Plug','h3','Surampalem',17.0905,82.0585,18,15,'DC','CCS2'],['Peddapuram Home Bay','h4','Peddapuram',17.0742,82.1425,11,3.3,'AC','Type 2'],['Samalkot Sun Charger','h5','Samalkot',17.0555,82.1702,13,7.4,'AC','Type 2'],['Lakeside Garage','h1','Rajahmundry',16.9968,81.7962,15,11,'AC','Type 2'],['Coastal EV Point','h2','Kakinada',16.9855,82.2512,20,22,'DC','CCS2'],['Temple Road Plug','h4','Peddapuram',17.0811,82.1358,10,3.3,'AC','Type 2']];
 const pts=pn.map((p,i)=>({id:'p'+(i+1),n:p[0],h:p[1],t:p[2],lat:p[3],lon:p[4],pr:p[5],kw:p[6],ty:p[7],cn:p[8],park:i%3?'Covered parking, 1 car':'Open driveway, 2 cars',a:[7,21],min:1,max:4,days:'Mon–Sun',paused:0,load:'5 kW single phase',inst:'Dedicated EVSE, installed by licensed electrician'}));
 const st=['completed','completed','completed','completed','completed','pending','pending','accepted','confirmed','rejected'];
 const bk=st.map((s,i)=>{const p=pts[i%8],kwh=+(8+i*2.1).toFixed(1);return{id:'BK'+(1001+i),pt:p.id,o:'o'+(i%5+1),d:s=='completed'?dt(-(i*2+1)):dt(i-3),s:8+i,du:2,tg:80,kwh,amt:+(kwh*p.pr).toFixed(2),st:s,paid:s=='completed'||s=='confirmed',tx:s=='completed'||s=='confirmed'?'TXN'+(77000+i):''}});
 const rv=[['BK1001','o1',5,'Easy to find and very helpful host.'],['BK1002','o2',4,'Good price, charger worked well.'],['BK1003','o3',5,'Safe setup, clean parking.'],['BK1004','o4',4,'Slightly slow but fair rate.'],['BK1005','o5',3,'Host was late to open the gate.']].map((r,i)=>({id:'R'+i,b:r[0],o:r[1],s:r[2],t:r[3],rep:''}));
 S={users:u,pts,bk,rv,notes:[],reports:[{id:'RP1',by:'o3',t:'Host asked for extra cash fee (demo report)',st:'open'}],fee:5,ses:null};save()}
function home(){return U.role=='owner'?'find':U.role=='host'?'hd':'ad'}
const usr=id=>S.users.find(u=>u.id==id),pt=id=>S.pts.find(p=>p.id==id);
const rate=h=>{const r=S.rv.filter(x=>pt(S.bk.find(b=>b.id==x.b)?.pt)?.h==h);return r.length?r.reduce((a,x)=>a+x.s,0)/r.length:0};
const vst=h=>{const n=Object.values(usr(h).v).filter(Boolean).length;return n==5?['Verified (demo)','ok']:n>=2?['Pending','w']:['Unverified','x']};
const hav=(a,b,c,d)=>{const r=x=>x*Math.PI/180,k=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(k))};
const dist=p=>{const l=F.gps||TOWNS[F.loc];return hav(l[0],l[1],p.lat,p.lon)};
const notify=(to,m)=>{S.notes.unshift({to,m,t:new Date().toLocaleString(),r:0})};
const fee=a=>+(a*S.fee/100).toFixed(2);
function go(v,p){V=v;P=p;R();scrollTo(0,0)}
const TABS={owner:[['find','Find'],['calc','Calculator'],['bk','Bookings'],['veh','Vehicle'],['alerts','Alerts'],['prof','Profile'],['help','Help']],host:[['hd','Dashboard'],['pts','Charging points'],['rev','Reviews'],['alerts','Alerts'],['prof','Profile'],['help','Help']],admin:[['ad','Admin'],['prof','Profile']]};
function R(){
 const n=$('#nav');
 if(!U)n.innerHTML=`<button onclick="go('land')">Home</button><button onclick="go('about')">About</button><button onclick="go('login')">Login</button><button onclick="go('reg')">Register</button>`;
 else{const c=S.notes.filter(x=>x.to==U.id&&!x.r).length;n.innerHTML=TABS[U.role].map(t=>`<button class="${V==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}${t[0]=='alerts'&&c?' ('+c+')':''}</button>`).join('')+`<button onclick="out()">Logout</button>`}
 $('#m').innerHTML=(VIEWS[V]||VIEWS.land)();if(V=='calc')calc();if(V=='det'&&BK){const v=(U.veh||[])[0];window.BC=v&&VEH[v.m]?VEH[v.m][0]:40;bq()}
}
const out=()=>{U=null;S.ses=null;save();go('land')};
const VIEWS={
land:()=>`<div class="hero"><h1>⚡ ChargeShare</h1><p style="font-size:18px">Your Neighbourhood is Your Charging Network.</p><p>EV owners find safe home chargers nearby. Homeowners with proper EV chargers earn money.</p><button class="b" onclick="go('reg')">Get started</button> <button class="b s" onclick="go('login')">Try demo login</button></div>
<div class="g g2" style="margin-top:14px">${[['🔍','Find nearby','Map and list of home chargers with price, power and rating.'],['🧮','Know the cost','Calculator shows energy, time, cost and range gained.'],['💰','Earn as a host','Set your price, accept requests and track earnings.']].map(x=>`<div class="card"><div style="font-size:28px">${x[0]}</div><b>${x[1]}</b><div class="mu">${x[2]}</div></div>`).join('')}</div>`,
about:()=>`<div class="card"><h2>About ChargeShare</h2><p>ChargeShare connects EV owners who need a charge with homeowners who have a dedicated, safely installed EV charger. Host locations stay approximate until a booking is accepted.</p><div class="warn">Safety: an ordinary home socket is not a safe way to charge every EV. Hosts must use a dedicated EV charger (EVSE) installed by a qualified electrician. This is a college prototype: payments are simulated and "verified" badges on demo accounts are not real verification.</div></div>`,
login:()=>`<div class="card" style="max-width:420px;margin:auto"><h2>Login</h2><label>Email or mobile</label><input id="li"><label>Password</label><input id="lp" type="password"><label><input type="checkbox" id="rm" style="width:auto"> Remember me <span style="float:right"><input type="checkbox" style="width:auto" onclick="lp.type=this.checked?'text':'password'"> Show</span></label><br><button class="b" onclick="login()">Login</button> <button class="b s" onclick="toast('Demo: a reset link would be sent to your email')">Forgot password</button>
<div class="warn" style="margin-top:14px"><b>Demo accounts</b> (fictional), password <b>Demo@123</b><br>
<button class="b s" onclick="fill('owner1@demo.cs')">EV owner</button> <button class="b s" onclick="fill('host1@demo.cs')">Host</button> <button class="b s" onclick="fill('admin@demo.cs')">Admin</button><br>owner1@demo.cs · host1@demo.cs · admin@demo.cs</div></div>`,
reg:()=>`<div class="card" style="max-width:560px;margin:auto"><h2>Create account</h2><div class="g g2"><div><label>Full name</label><input id="rn"></div><div><label>Account type</label><select id="rr"><option value="owner">EV Owner</option><option value="host">Homeowner / Host</option></select></div><div><label>Email</label><input id="re" type="email"></div><div><label>Mobile (+91)</label><input id="rm" maxlength="10" placeholder="10 digits"></div><div><label>Password (min 8)</label><input id="rp" type="password"></div><div><label>Confirm password</label><input id="rc" type="password"></div><div><label>State</label><input id="rs" value="Andhra Pradesh"></div><div><label>District</label><input id="rd" value="East Godavari"></div><div><label>City / Town</label><select id="rt">${Object.keys(TOWNS).map(t=>`<option>${t}</option>`).join('')}</select></div><div><label>PIN code</label><input id="rz" maxlength="6"></div><div><label>Date of birth (optional)</label><input id="rb" type="date"></div><div><label>Gender (optional)</label><select id="rg"><option></option><option>Female</option><option>Male</option><option>Other</option></select></div></div><label>Profile photo</label><input type="file" id="rf" accept="image/*"><br><button class="b" onclick="reg()">Register</button></div>`,
find:()=>{const L=list();return `<h2>Find a charger</h2><div class="card"><div class="g g4"><div><label>Your location</label><select onchange="F.gps=0;F.loc=this.value;R()">${Object.keys(TOWNS).map(t=>`<option ${F.loc==t&&!F.gps?'selected':''}>${t}</option>`).join('')}</select><button class="b s" style="margin-top:4px;width:100%" onclick="gps()">Use my GPS</button></div>
<div><label>Distance (km)</label><select onchange="F.r=+this.value;R()">${[2,5,10,20,50].map(x=>`<option ${F.r==x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Max ₹/kWh</label><input type="number" value="${F.max}" onchange="F.max=+this.value;R()"></div>
<div><label>Type</label><select onchange="F.t=this.value;R()"><option value="">AC or DC</option><option ${F.t=='AC'?'selected':''}>AC</option><option ${F.t=='DC'?'selected':''}>DC</option></select></div><div><label>Connector</label><select onchange="F.c=this.value;R()"><option value="">Any</option><option ${F.c=='Type 2'?'selected':''}>Type 2</option><option ${F.c=='CCS2'?'selected':''}>CCS2</option></select></div><div><label>Min rating</label><select onchange="F.rat=+this.value;R()">${[0,3,4,4.5].map(x=>`<option ${F.rat==x?'selected':''}>${x}</option>`).join('')}</select></div></div>
<label style="display:inline"><input type="checkbox" style="width:auto" ${F.now?'checked':''} onchange="F.now=+this.checked;R()"> Available now</label> &nbsp; <label style="display:inline"><input type="checkbox" style="width:auto" ${F.ver?'checked':''} onchange="F.ver=+this.checked;R()"> Verified hosts only</label> &nbsp; <button class="b s" onclick="F.view='map';R()">Map</button> <button class="b s" onclick="F.view='list';R()">List</button></div>
${L[0]?`<div class="card"><b>⭐ Best match:</b> ${L[0].n} — ${dist(L[0]).toFixed(1)} km, ₹${L[0].pr}/kWh, ${L[0].kw} kW <span class="mu">(score uses distance, price, connector and availability)</span> <button class="b" onclick="go('det','${L[0].id}')">View</button></div>`:'<div class="card">No charging points match these filters.</div>'}
${F.view=='map'?mapSvg(L):''}<div class="g g2">${L.map(card).join('')}</div>
<div class="card"><h3>Public station comparison (illustrative)</h3><p class="mu">Typical public fast-charging tariffs are around ₹18–24/kWh. Home hosts here: ₹${Math.min(...S.pts.map(p=>p.pr))}–${Math.max(...S.pts.map(p=>p.pr))}/kWh. Check actual tariffs before you travel.</p></div>`},
det:()=>{const p=pt(P),h=usr(p.h),v=vst(h.id),rv=S.rv.filter(r=>S.bk.find(b=>b.id==r.b)?.pt==p.id);
 const bk=S.bk.find(b=>b.pt==p.id&&b.o==U.id&&['accepted','confirmed'].includes(b.st));const fv=(U.fav||[]).includes(p.id);
 return `<button class="b s" onclick="go('find')">← Back</button><div class="card" style="margin-top:10px"><h2>${p.n} ${p.paused?'<span class="tag x">Paused</span>':''}</h2><p>Host: <b>${h.name}</b> <span class="tag ${v[1]}">${v[0]}</span> ⭐ ${rate(h.id)?rate(h.id).toFixed(1):'New'}</p>
<div class="g g4"><div><div class="stat">₹${p.pr}</div><div class="mu">per kWh</div></div><div><div class="stat">${p.kw} kW</div><div class="mu">${p.ty} · ${p.cn}</div></div><div><div class="stat">${dist(p).toFixed(1)} km</div><div class="mu">approx. distance</div></div><div><div class="stat">${p.a[0]}:00–${p.a[1]}:00</div><div class="mu">${p.days}</div></div></div>
<p>🅿 ${p.park}<br>🔌 ${p.load} · ${p.inst}<br>📍 Approximate area: near ${p.t}. ${bk?`<b>Exact address:</b> ${h.addr}`:'Exact address is shared only after your booking is accepted.'}</p>
<a class="b s" target="_blank" rel="noopener" href="https://www.openstreetmap.org/directions?to=${p.lat.toFixed(2)},${p.lon.toFixed(2)}">Directions (approx. area)</a> <button class="b s" onclick="fav('${p.id}')">${fv?'♥ Saved':'♡ Save'}</button> <button class="b" ${p.paused?'disabled':''} onclick="BK=1;R()">Book this charger</button></div>
${BK?bookForm(p):''}<div class="card"><h3>Reviews</h3>${rv.map(r=>`<p>${'★'.repeat(r.s)}${'☆'.repeat(5-r.s)} ${r.t}<br>${r.rep?`<span class="mu">Host: ${r.rep}</span>`:''}</p>`).join('')||'<p class="mu">No reviews yet.</p>'}</div>`},
calc:()=>{const m=P&&VEH[P]?P:'Tata Nexon EV';return `<h2>Charging cost calculator</h2><div class="card"><div class="g g4"><div><label>Vehicle</label><select id="cm" onchange="P=this.value;R()">${Object.keys(VEH).map(k=>`<option ${k==m?'selected':''}>${k}</option>`).join('')}</select></div><div><label>Battery (kWh)</label><input id="cb" type="number" value="${VEH[m][0]}" oninput="calc()"></div><div><label>Current %</label><input id="cc" type="number" value="20" oninput="calc()"></div><div><label>Target %</label><input id="ct" type="number" value="80" oninput="calc()"></div><div><label>Price ₹/kWh</label><input id="cp" type="number" value="12" oninput="calc()"></div><div><label>Efficiency %</label><input id="ce" type="number" value="90" oninput="calc()"></div><div><label>Charger kW</label><input id="ck" type="number" value="${Math.min(VEH[m][2],7.4)}" oninput="calc()"></div></div><div id="co"></div></div><div class="card"><h3>Compare hosts for this charge</h3><div id="cmp" class="sc"></div></div>`},
bk:()=>{const mine=U.role=='owner'?S.bk.filter(b=>b.o==U.id):S.bk.filter(b=>pt(b.pt).h==U.id);const sp=mine.filter(b=>b.paid).reduce((a,b)=>a+b.amt+fee(b.amt),0);
 return `<h2>Booking history</h2><div class="card">Total spent on charging: <b>₹${sp.toFixed(2)}</b> · Energy: <b>${mine.filter(b=>b.st=='completed').reduce((a,b)=>a+b.kwh,0).toFixed(1)} kWh</b> · CO₂ avoided ≈ <b>${co2(mine.filter(b=>b.st=='completed').reduce((a,b)=>a+b.kwh,0))} kg</b><div class="mu">Assumes EV uses 7 km/kWh, grid emits 0.71 kg CO₂/kWh, petrol car 0.12 kg CO₂/km. Estimate only.</div></div><div class="card sc"><table><tr><th>ID</th><th>Point</th><th>Date</th><th>Time</th><th>kWh</th><th>Amount</th><th>Status</th><th></th></tr>${mine.map(bkRow).join('')||'<tr><td colspan=8>No bookings</td></tr>'}</table></div>`},
veh:()=>{const v=U.veh||[];return `<h2>My vehicles</h2>${v.map((x,i)=>{const d=VEH[x.m]||[x.kwh||40,x.rng||300,7];const sp=S.bk.filter(b=>b.o==U.id&&b.paid).reduce((a,b)=>a+b.amt,0);return `<div class="card"><b>${x.m}</b> · ${x.reg} · ${x.yr}<div class="g g4"><div><div class="stat">${d[0]} kWh</div><div class="mu">battery</div></div><div><div class="stat">${x.pct}%</div><div class="mu">current</div></div><div><div class="stat">${Math.round(d[1]*x.pct/100)} km</div><div class="mu">est. remaining range</div></div><div><div class="stat">₹${sp.toFixed(0)}</div><div class="mu">spent on charging</div></div></div>${x.pct<=20?'<div class="warn">⚠ Low battery! Find a charger soon.</div>':''}<label>Battery level ${x.pct}%</label><input type="range" min="1" max="100" value="${x.pct}" oninput="U.veh[${i}].pct=+this.value" onchange="upd();R()"> <span class="mu">Connector ${x.cs||'CCS2'}</span></div>`}).join('')}
<div class="card"><h3>Add vehicle</h3><div class="g g4"><div><label>Model</label><select id="vm" onchange="vc.style.display=this.value=='Custom'?'block':'none'">${Object.keys(VEH).map(k=>`<option>${k}</option>`).join('')}<option>Custom</option></select></div><div><label>Reg. number</label><input id="vr"></div><div><label>Year</label><input id="vy" type="number" value="2025"></div><div><label>Battery %</label><input id="vp" type="number" value="50"></div></div><div id="vc" style="display:none" class="g g4"><div><label>Battery kWh</label><input id="vk" type="number" value="30"></div><div><label>Range km</label><input id="vg" type="number" value="250"></div></div><br><button class="b" onclick="addVeh()">Add</button></div>

rev:()=>{const mp=S.pts.filter(p=>p.h==U.id).map(p=>p.id),r=S.rv.filter(x=>mp.includes(S.bk.find(b=>b.id==x.b)?.pt));return `<h2>Reviews</h2>${r.map(x=>`<div class="card">${'★'.repeat(x.s)}${'☆'.repeat(5-x.s)} <b>${usr(x.o).name}</b> on ${pt(S.bk.find(b=>b.id==x.b).pt).n}<p>${x.t}</p>${x.rep?`<div class="mu">Your reply: ${x.rep}</div>`:`<input id="rp${x.id}" placeholder="Reply"> <button class="b s" style="margin-top:4px" onclick="x=S.rv.find(q=>q.id=='${x.id}');x.rep=$('#rp${x.id}').value;save();R()">Reply</button>`}</div>`).join('')||'<p>No reviews yet.</p>'}`},
alerts:()=>{const n=S.notes.filter(x=>x.to==U.id);n.forEach(x=>x.r=1);save();return `<h2>Notifications</h2><div class="card">${n.map(x=>`<p>🔔 ${x.m}<br><span class="mu">${x.t}</span></p>`).join('')||'No notifications.'}</div>`},
prof:()=>`<h2>Profile & settings</h2><div class="card"><div class="g g4"><div><label>Name</label><input id="pn" value="${U.name}"></div><div><label>Email</label><input value="${U.email}" disabled></div><div><label>Mobile</label><input id="pm" value="${U.mob}"></div><div><label>City</label><input id="pc" value="${U.city||''}"></div><div><label>PIN</label><input id="pz" value="${U.pin||''}"></div></div><p>Account verification: ${U.role=='host'?`<span class="tag ${vst(U.id)[1]}">${vst(U.id)[0]}</span>`:'<span class="tag w">Email/mobile not verified (demo)</span>'}</p><button class="b" onclick="U.name=pn.value;U.mob=pm.value;U.city=pc.value;U.pin=pz.value;upd();toast('Profile saved');R()">Save</button></div>
<div class="card"><h3>Change password</h3><input id="op" type="password" placeholder="Current"><br><br><input id="np" type="password" placeholder="New (min 8)"><br><br><button class="b" onclick="chpw()">Update</button></div><div class="card">Referral code: <b>CS-${U.id.toUpperCase()}</b> — invite a friend, both get a demo ₹50 credit (no real money).</div>`,
help:()=>`<h2>Help & support</h2><div class="card"><h3>FAQ</h3><p><b>Is my address public?</b> No, only an approximate area is shown until a booking is accepted.</p><p><b>Are payments real?</b> No, this prototype simulates payments.</p><p><b>Can I charge from a normal socket?</b> Not safely for every EV. Use a dedicated EV charger installed by a qualified electrician.</p></div><div class="card"><h3>Emergency</h3><p>National emergency: <b>112</b>. Support (demo): support@chargeshare.demo</p><label>Report an issue</label><textarea id="ri"></textarea><br><button class="b" onclick="S.reports.push({id:'RP'+(S.reports.length+1),by:U.id,t:ri.value,st:'open'});save();ri.value='';toast('Report sent')">Submit</button></div>`,
ad:()=>{const o=S.users.filter(u=>u.role=='owner'),h=S.users.filter(u=>u.role=='host'),rev=S.bk.filter(b=>b.paid).reduce((a,b)=>a+fee(b.amt),0);
 return `<h2>Admin dashboard</h2><div class="g g4">${[['Users',S.users.length],['EV owners',o.length],['Hosts',h.length],['Charging points',S.pts.length],['Active bookings',S.bk.filter(b=>['pending','accepted','confirmed'].includes(b.st)).length],['Completed',S.bk.filter(b=>b.st=='completed').length],['Platform revenue','₹'+rev.toFixed(0)],['Open reports',S.reports.filter(r=>r.st=='open').length]].map(x=>`<div class="card"><div class="stat">${x[1]}</div><div class="mu">${x[0]}</div></div>`).join('')}</div>
<div class="card">Platform fee % <input type="number" value="${S.fee}" style="width:80px" onchange="S.fee=+this.value;save();toast('Fee updated')"></div>

<div class="card"><h3>Reports</h3>${S.reports.map(r=>`<p>${r.id} · ${usr(r.by)?.name}: ${r.t} <span class="tag ${r.st=='open'?'w':'ok'}">${r.st}</span> ${r.st=='open'?`<button class="b s" onclick="S.reports.find(q=>q.id=='${r.id}').st='resolved';save();R()">Resolve</button>`:''}</p>`).join('')}</div>`}
};
function card(p){const h=usr(p.h),v=vst(h.id);return `<div class="card pt" onclick="go('det','${p.id}')"><b>${p.n}</b> <span class="tag ${v[1]}">${v[0]}</span><br>${h.name} · ⭐ ${rate(h.id)?rate(h.id).toFixed(1):'New'}<br>📍 near ${p.t} · ${dist(p).toFixed(1)} km<br><b>₹${p.pr}/kWh</b> · ${p.kw} kW ${p.ty} · ${p.cn}<br><span class="mu">${p.park} · ${p.a[0]}:00–${p.a[1]}:00</span></div>`}
function list(){const h=new Date().getHours(),l=S.pts.filter(p=>!usr(p.h).susp&&dist(p)<=F.r&&p.pr<=F.max&&(!F.t||p.ty==F.t)&&(!F.c||p.cn==F.c)&&(!F.now||(!p.paused&&h>=p.a[0]&&h<p.a[1]))&&(!F.ver||vst(p.h)[1]=='ok')&&rate(p.h)>=F.rat);return l.sort((a,b)=>score(a)-score(b))}
const score=p=>dist(p)*1.5+p.pr*0.5+(p.paused?50:0)+(U&&U.veh&&U.veh[0]&&(p.cn=='CCS2'||p.ty=='AC')?0:5);
function mapSvg(L){const x=lo=>(lo-81.72)*1000,y=la=>(17.13-la)*1800,l=F.gps||TOWNS[F.loc];
 return `<div class="card"><svg viewBox="0 0 600 360" width="100%" style="background:#e6f4ef;border-radius:10px"><path d="M0 250 Q150 200 300 240 T600 215" stroke="#9ad7e8" stroke-width="10" fill="none"/>${Object.entries(TOWNS).map(([n,c])=>`<text x="${x(c[1])}" y="${y(c[0])+34}" font-size="11" fill="#5b6b80" text-anchor="middle">${n}</text>`).join('')}${L.map(p=>`<g style="cursor:pointer" onclick="go('det','${p.id}')"><circle cx="${x(p.lon)}" cy="${y(p.lat)}" r="16" fill="#10b981" fill-opacity=".25" stroke="#10b981"/><rect x="${x(p.lon)-22}" y="${y(p.lat)-9}" width="44" height="18" rx="9" fill="#0b1b33"/><text x="${x(p.lon)}" y="${y(p.lat)+4}" font-size="10" fill="#fff" text-anchor="middle">₹${p.pr}·${p.kw}kW</text></g>`).join('')}<circle cx="${x(l[1])}" cy="${y(l[0])}" r="6" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="${x(l[1])+9}" y="${y(l[0])-6}" font-size="11" fill="#2563eb">You</text></svg><div class="mu">Schematic map with approximate host zones (circles), not exact locations. Tap a marker for details.</div></div>`}
function gps(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{F.gps=[p.coords.latitude,p.coords.longitude];R()},()=>toast('Location permission denied; pick a town instead')):toast('GPS not available')}
function fav(id){U.fav=U.fav||[];const i=U.fav.indexOf(id);i<0?U.fav.push(id):U.fav.splice(i,1);upd();R()}
const upd=()=>{save()};
function fill(e){$('#li').value=e;$('#lp').value='Demo@123'}
async function login(){const i=$('#li').value.trim(),p=await sha($('#lp').value),u=S.users.find(x=>(x.email==i||x.mob==i)&&x.pw==p);if(!u)return toast('Invalid credentials');if(u.susp)return toast('This account is suspended');U=u;if($('#rm').checked)S.ses=u.id;save();go(home())}
async function reg(){const g=id=>$('#'+id).value.trim(),e=g('re'),pw=$('#rp').value;if(!g('rn')||!/^\S+@\S+\.\S+$/.test(e))return toast('Enter name and valid email');if(!/^\d{10}$/.test($('#rm').value))return toast('Mobile must be 10 digits');if(pw.length<8||pw!=$('#rc').value)return toast('Passwords must match (min 8)');if(S.users.some(u=>u.email==e))return toast('Email already registered');
 let ph='';const f=$('#rf').files[0];if(f&&f.size<150000)ph=await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)});
 const u={id:'u'+Date.now(),role:g('rr'),name:g('rn'),email:e,mob:$('#rm').value,pw:await sha(pw),city:g('rt'),state:g('rs'),dist:g('rd'),pin:g('rz'),dob:g('rb'),gender:g('rg'),photo:ph,veh:[],fav:[]};if(u.role=='host')u.v={mobile:0,email:0,property:0,charger:0,safety:0};S.users.push(u);U=u;save();toast('Welcome to ChargeShare!');go(home())}
function chpw(){sha($('#op').value).then(async h=>{if(h!=U.pw)return toast('Current password is wrong');if($('#np').value.length<8)return toast('Min 8 characters');U.pw=await sha($('#np').value);save();toast('Password changed')})}
function addVeh(){const m=$('#vm').value,c=m=='Custom';if(c)VEH['Custom '+$('#vr').value]=[+$('#vk').value,+$('#vg').value,7];U.veh.push({m:c?'Custom '+$('#vr').value:m,reg:$('#vr').value,yr:+$('#vy').value,pct:+$('#vp').value,cs:'CCS2'});upd();R()}
function addPt(){if(!$('#ai').checked||!$('#an').value)return toast('Add a name and confirm qualified installation');const t=$('#at').value,c=TOWNS[t];S.pts.push({id:'p'+Date.now(),n:$('#an').value,h:U.id,t,lat:c[0]+(Math.random()-.5)*.02,lon:c[1]+(Math.random()-.5)*.02,pr:+$('#ap').value,kw:+$('#ak').value,ty:$('#ay').value,cn:$('#ac').value,park:$('#ar').value,a:[7,21],min:1,max:4,days:'Mon–Sun',paused:0,load:$('#al').value,inst:'Declared by host: qualified installation (not yet verified)'});save();toast('Charging point added');R()}
function bookForm(p){const v=(U.veh||[])[0],d=v&&VEH[v.m]?VEH[v.m]:[40,350,7];return `<div class="card"><h3>Book ${p.n}</h3><div class="g g4"><div><label>Date</label><input type="date" id="bd" min="${TODAY}" value="${TODAY}" oninput="bq()"></div><div><label>Start</label><select id="bs" onchange="bq()">${Array.from({length:p.a[1]-p.a[0]},(_,i)=>`<option>${p.a[0]+i}</option>`).join('')}</select></div><div><label>Hours</label><select id="bh" onchange="bq()">${Array.from({length:p.max-p.min+1},(_,i)=>`<option>${p.min+i}</option>`).join('')}</select></div><div><label>Current %</label><input type="number" id="bc" value="${v?v.pct:20}" oninput="bq()"></div><div><label>Target %</label><input type="number" id="bt" value="80" oninput="bq()"></div></div><div id="bq" style="margin:10px 0"></div><button class="b" onclick="submitBk('${p.id}')">Submit request</button></div>`}
function bq(){const p=pt(P),b=+$('#bh').value,c=+$('#bc').value,t=+$('#bt').value,need=BC*Math.max(t-c,0)/100,kwh=Math.min(need,p.kw*b*0.9),a=kwh*p.pr,f=fee(a);$('#bq').innerHTML=`Energy ≈ <b>${kwh.toFixed(1)} kWh</b>${kwh<need?' (limited by booking length)':''} · Charging ₹${a.toFixed(2)} + service fee ₹${f.toFixed(2)} = <b>₹${(a+f).toFixed(2)}</b><div class="mu">Estimate only; actual cost varies with losses, temperature and vehicle limits.</div>`}
function submitBk(id){const p=pt(id),d=$('#bd').value,s=+$('#bs').value,h=+$('#bh').value;if(s+h>p.a[1])return toast('Outside host hours');if(S.bk.some(b=>b.pt==id&&b.d==d&&['accepted','confirmed'].includes(b.st)&&s<b.s+b.du&&b.s<s+h))return toast('Slot overlaps a confirmed booking');
 const txt=$('#bq').textContent,kwh=+(/≈ ([\d.]+) kWh/.exec(txt)||[0,0])[1];const b={id:'BK'+(1001+S.bk.length),pt:id,o:U.id,d,s,du:h,tg:+$('#bt').value,kwh,amt:+(kwh*p.pr).toFixed(2),st:'pending',paid:0,tx:''};S.bk.push(b);notify(p.h,`New booking request ${b.id} for ${p.n}`);BK=0;save();toast('Request sent to host');go('bk')}
function bkRow(b){const p=pt(b.pt),c={pending:'w',accepted:'ok',confirmed:'ok',completed:'ok',rejected:'x',cancelled:'x'}[b.st];let a='';
 if(U.role=='host'){if(b.st=='pending')a=`<button class="b" onclick="setB('${b.id}','accepted')">Accept</button> <button class="b r" onclick="setB('${b.id}','rejected')">Reject</button>`;if(b.st=='confirmed')a=`<button class="b" onclick="setB('${b.id}','completed')">Mark completed</button>`}
 else{if(b.st=='accepted')a=`<button class="b" onclick="pay('${b.id}')">Pay</button>`;if(['pending','accepted','confirmed'].includes(b.st))a+=` <button class="b s" onclick="setB('${b.id}','cancelled')">Cancel</button>`;if(b.st=='completed'&&!S.rv.some(r=>r.b==b.id))a=`<button class="b s" onclick="rvw('${b.id}')">Review</button>`}
 return `<tr><td>${b.id}</td><td>${p.n}</td><td>${b.d}</td><td>${b.s}:00 (${b.du}h)</td><td>${b.kwh}</td><td>₹${(b.amt+fee(b.amt)).toFixed(0)}${b.paid?' ✓':''}</td><td><span class="tag ${c}">${b.st}</span></td><td>${a}</td></tr>`}
function setB(id,s){const b=S.bk.find(x=>x.id==id);b.st=s;const t=U.role=='host'?b.o:pt(b.pt).h;notify(t,`Booking ${id} is now ${s}`);save();R()}
function pay(id){const b=S.bk.find(x=>x.id==id),tot=b.amt+fee(b.amt);$('#m').innerHTML=`<div class="card" style="max-width:420px;margin:auto"><h3>Payment (simulation)</h3><p>Charging ₹${b.amt.toFixed(2)}<br>Service fee (${S.fee}%) ₹${fee(b.amt).toFixed(2)}<br><b>Total ₹${tot.toFixed(2)}</b></p><label>Method</label><select id="pmth"><option>UPI</option><option>Credit / Debit Card</option><option>Net Banking</option><option>Cash / Pay at property</option></select><p class="mu">No real money is processed.</p><button class="b" onclick="b=S.bk.find(x=>x.id=='${id}');b.paid=1;b.st='confirmed';b.tx='TXN'+Math.floor(Math.random()*1e6);notify(pt(b.pt).h,'Payment received for '+b.id+' ('+pmth.value+', '+b.tx+')');save();toast('Paid · '+b.tx);go('bk')">Pay now</button> <button class="b s" onclick="go('bk')">Back</button></div>`}
function rvw(id){$('#m').innerHTML=`<div class="card" style="max-width:420px;margin:auto"><h3>Review ${id}</h3><label>Stars</label><select id="rs">${[5,4,3,2,1].map(x=>`<option>${x}</option>`).join('')}</select><label>Comment</label><textarea id="rt"></textarea><br><br><button class="b" onclick="S.rv.push({id:'R'+Date.now(),b:'${id}',o:U.id,s:+rs.value,t:rt.value,rep:''});notify(pt(S.bk.find(x=>x.id=='${id}').pt).h,'New review received');save();toast('Thanks for your review');go('bk')">Submit</button></div>`}
function calc(){const g=id=>+$('#'+id).value,cap=g('cb'),c=g('cc'),t=g('ct'),p=g('cp'),e=g('ce')/100||1,k=g('ck')||1,m=$('#cm').value,rng=(VEH[m]||[0,300])[1],need=cap*Math.max(t-c,0)/100,grid=need/e,cost=need*p;
 $('#co').innerHTML=`<div class="g g4" style="margin-top:12px">${[['Energy needed',need.toFixed(2)+' kWh'],['Grid consumption',grid.toFixed(2)+' kWh'],['Est. cost','₹'+cost.toFixed(2)],['Est. time',(grid/k).toFixed(1)+' h'],['Range gained','≈ '+Math.round(rng*(t-c)/100)+' km'],['CO₂ avoided',co2(grid)+' kg']].map(x=>`<div class="card"><div class="stat" style="font-size:20px">${x[1]}</div><div class="mu">${x[0]}</div></div>`).join('')}</div><p class="mu">${cap} × (${t}−${c})/100 = ${need.toFixed(2)} kWh × ₹${p} = ₹${cost.toFixed(2)}. Actual use and cost vary with charging losses, temperature, vehicle limits and extra fees. CO₂: assumes 7 km/kWh, grid 0.71 kg/kWh, petrol car 0.12 kg/km.</p>`;
 $('#cmp').innerHTML='<table><tr><th>Host</th><th>₹/kWh</th><th>Cost</th><th>Time</th><th>Distance</th></tr>'+[...S.pts].sort((a,b)=>a.pr-b.pr).map(h=>`<tr><td>${h.n}</td><td>${h.pr}</td><td>₹${(need*h.pr).toFixed(0)}</td><td>${(grid/Math.min(h.kw,k||h.kw)).toFixed(1)} h</td><td>${dist(h).toFixed(1)} km</td></tr>`).join('')+'</table>'}
const co2=kwh=>Math.max(kwh*7*0.12-kwh*0.71,0).toFixed(1);
function bars(l,v){const m=Math.max(...v,1);return `<svg viewBox="0 0 400 160" width="100%">${v.map((x,i)=>`<rect x="${i*56+14}" y="${130-x/m*110}" width="36" height="${x/m*110}" rx="4" fill="#10b981"/><text x="${i*56+32}" y="${126-x/m*110}" font-size="10" text-anchor="middle" fill="currentColor">₹${Math.round(x)}</text><text x="${i*56+32}" y="150" font-size="10" text-anchor="middle" fill="currentColor">${l[i]}</text>`).join('')}</svg>`}
(async()=>{try{S=JSON.parse(localStorage.getItem('cs1'))}catch(e){}if(!S||!S.users)await seed();const u=S.ses&&usr(S.ses);if(u&&!u.susp){U=u;V=home()}R()})();
</script></body></html>
